# Local Postgres for development. The init script creates the least-privilege
# `app_user` role the API connects as (RLS only enforces for non-superuser,
# NOBYPASSRLS roles), while Alembic migrates over the admin `postgres` role.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: branchchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d branchchat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
